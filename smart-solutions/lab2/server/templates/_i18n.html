  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const selector = document.getElementById('ui-language');
  if (!selector) return;
  let language = 'et';
  const t = key => own(messages[language], key) ? messages[language][key] : '';
  window.Lab2I18n = Object.freeze({t});
  function applyLanguage(value) {
    language = own(messages, value) ? value : 'et';
    document.documentElement.lang = language;
    selector.value = language;
    document.querySelectorAll('[data-i18n]').forEach(element => {
      const key = element.dataset.i18n;
      if (own(messages[language], key)) {
        element.textContent = t(key).replace('{max}', element.dataset.i18nMax || '');
      }
    });
    window.dispatchEvent(new Event('lab2:languagechange'));
  }
  selector.addEventListener('change', () => {
    const value = own(messages, selector.value) ? selector.value : 'et';
    try { localStorage.setItem('lab2-language', value); } catch (_) { /* In-memory choice still works. */ }
    applyLanguage(value);
  });
  let saved = 'et';
  try { saved = localStorage.getItem('lab2-language') || 'et'; } catch (_) { /* Estonian fallback. */ }
  applyLanguage(saved);
  document.getElementById('language-control').hidden = false;
